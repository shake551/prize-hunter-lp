            <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
                <span></span>

                <span></span>
            </button>
        </nav>
    </header>

    <!-- Mobile nav overlay -->
    <div class="mobile-nav-overlay" id="mobile-nav-overlay">
        <ul class="mobile-nav-links">
            <li><a href="index.html#features">機能</a></li>
            <li><a href="index.html#premium">プレミアム</a></li>

            <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
    </div>

    <main class="legal-page">
        <div class="legal-content" style="text-align: center;">
            <h1>お問い合わせありがとうございました</h1>
            <p style="margin: 2rem 0;">内容を確認後、お返事させていただくことがあります。</p>

    <script>
    // === Hamburger Menu ===
    (function() {
        var btn = document.getElementById('hamburger');
        var overlay = document.getElementById('mobile-nav-overlay');
        var links = overlay.querySelectorAll('a');

        function toggle() {
            var open = btn.getAttribute('aria-expanded') === 'true';
            btn.setAttribute('aria-expanded', !open);
            btn.classList.toggle('open');
            overlay.classList.toggle('open');
            document.body.style.overflow = open ? '' : 'hidden';
        }

        btn.addEventListener('click', toggle);
        for (var i = 0; i < links.length; i++) {
            links[i].addEventListener('click', function() {
                if (overlay.classList.contains('open')) toggle();
            });
        }
    })();

    // === Header scroll effect ===
    (function() {
        var header = document.getElementById('site-header');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    })();

    // === Contact form completion event ===
    (function() {
        if (typeof gtag === 'function') {
            gtag('event', 'contact_form_submit');
        }
    })();
    </script>
