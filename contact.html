    <main class="legal-page">
        <div class="legal-content">
            <a href="index.html" class="back-link">&larr; トップに戻る</a>
            <h1>お問い合わせ</h1>
            <p style="margin-bottom: 2rem;">お問い合わせ内容をご記入ください。</p>

            <form
                class="contact-form"
                action="https://docs.google.com/forms/d/e/1FAIpQLSfBLql4BgtYCtqcsMQ0Jj8jC1RXj72vM68rcJ9zdjzcvxOt-A/formResponse"
                method="POST"
                target="hidden_iframe"
                onsubmit="submitted=true;"
            >
                <div class="form-item">
                    <label class="form-label" for="field-mail">
                        メールアドレス<span class="form-required">必須</span>
                    </label>
                    <input
                        name="entry.482502285"
                        class="form-input"
                        id="field-mail"
                        placeholder="sample@gmail.com"
                        type="email"
                        required
                    />
                </div>
                <div class="form-item">
                    <label class="form-label" for="field-message">
                        メッセージ内容<span class="form-required">必須</span>
                    </label>
                    <textarea
                        name="entry.2034524166"
                        class="form-input form-textarea"
                        id="field-message"
                        placeholder="お問い合わせ内容"
                        required
                    ></textarea>
                </div>
                <div class="form-submit">
                    <button type="submit" class="btn btn-primary">送信する</button>
                </div>
            </form>

            <script type="text/javascript">
                var submitted = false;
            </script>
            <iframe
                name="hidden_iframe"
                id="hidden_iframe"
                style="display: none"
                onload="if(submitted){window.location='thanks.html';}"
            ></iframe>

    <script>
    // === Hamburger Menu ===
    (function() {
        var btn = document.getElementById('hamburger');
        var overlay = document.getElementById('mobile-nav-overlay');
        var links = overlay.querySelectorAll('a');

        function toggle() {
            var open = btn.getAttribute('aria-expanded') === 'true';
            btn.setAttribute('aria-expanded', !open);
            btn.classList.toggle('open');
            overlay.classList.toggle('open');
            document.body.style.overflow = open ? '' : 'hidden';
        }

        btn.addEventListener('click', toggle);
        for (var i = 0; i < links.length; i++) {
            links[i].addEventListener('click', function() {
                if (overlay.classList.contains('open')) toggle();
            });
        }
    })();

    // === Header scroll effect ===
    (function() {
        var header = document.getElementById('site-header');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    })();
    </script>
